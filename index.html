<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A letter for you</title>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=VT323&display=swap" rel="stylesheet">
<style>
:root{--ink:#3d1d0d;--p1:#f8e2a6;--p2:#e9c274;--w1:#b76d33;--w2:#7a3f1c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%;-webkit-tap-highlight-color:transparent}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;overflow:hidden;background:#6a5a8c;font:400 27px/1.1 VT323,"Courier New",monospace;color:var(--ink);user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid #fff;outline-offset:2px}
#scene{position:fixed;left:0;top:0;image-rendering:pixelated;z-index:0;filter:saturate(1.35) contrast(1.06)}
#fx{position:fixed;inset:0;z-index:2;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.05) 0 1px,transparent 1px 3px),radial-gradient(ellipse at 50% 45%,transparent 52%,rgba(30,10,60,.5) 100%),linear-gradient(180deg,rgba(255,130,200,.16),transparent 35%,transparent 68%,rgba(90,60,220,.18))}
#dim{position:fixed;inset:0;background:#1d1030;opacity:0;transition:opacity 2s;z-index:1;pointer-events:none}
#dim.on{opacity:.32}

/* wooden game-style boxes */
.box{background:var(--p1);box-shadow:0 0 0 3px var(--p2),0 0 0 6px var(--w1),0 0 0 9px var(--w2),0 0 0 12px var(--ink),0 12px 0 12px rgba(0,0,0,.18)}
.hud{position:fixed;z-index:6;top:calc(16px + env(safe-area-inset-top,0px));right:16px;padding:6px 10px;text-align:center;font:700 15px/1.25 "Pixelify Sans",monospace;transition:opacity 1s}
.hud b{display:block;font-size:19px}

/* mailbox */
#mail{position:fixed;z-index:3;background:none;border:0;padding:0}
#mail canvas{image-rendering:pixelated;display:block}
#mail::before{content:"";position:absolute;inset:-18px}
#bang{position:absolute;left:50%;top:-38px;width:28px;height:32px;margin-left:-14px;text-align:center;font:700 22px/30px "Pixelify Sans",monospace;color:var(--ink);background:#ffd84d;box-shadow:0 0 0 3px var(--ink);animation:bob 1s steps(2) infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
#hint{position:fixed;z-index:4;left:0;right:0;bottom:calc(9% + env(safe-area-inset-bottom,0px));text-align:center;font:700 20px "Pixelify Sans",monospace;color:#fff;text-shadow:2px 2px 0 var(--ink);animation:blink 1.4s steps(2) infinite;transition:opacity .5s}
@keyframes blink{50%{opacity:.35}}
#ev{position:fixed;z-index:5;image-rendering:pixelated;opacity:0;pointer-events:none}
#toast{position:fixed;z-index:9;left:50%;top:calc(18px + env(safe-area-inset-top,0px));transform:translate(-50%,-220%);padding:10px 16px;white-space:nowrap;font:700 16px "Pixelify Sans",monospace;transition:transform .5s steps(6)}
#toast.on{transform:translate(-50%,0)}

/* dialogue */
#dlg{position:fixed;z-index:7;left:18px;right:18px;bottom:calc(26px + env(safe-area-inset-bottom,0px));max-width:640px;margin:0 auto;padding:16px 16px 18px;transform:translateY(160%);transition:transform .7s cubic-bezier(.2,.9,.3,1)}
#dlg.on{transform:none}
#tag{position:absolute;left:-2px;top:-42px;padding:4px 14px;background:var(--p1);font:700 18px "Pixelify Sans",monospace;box-shadow:0 0 0 3px var(--p2),0 0 0 6px var(--w1),0 0 0 9px var(--w2),0 0 0 12px var(--ink)}
.row{display:flex;gap:14px;align-items:flex-start}
#por{flex:none;width:80px;height:80px;image-rendering:pixelated;box-shadow:0 0 0 3px var(--w1),0 0 0 6px var(--ink);background:#f3cf9f}
#gif{display:none;max-width:100%;max-height:140px;margin:0 auto 10px;border-radius:2px;box-shadow:0 0 0 3px var(--ink)}
#txt{flex:1;min-height:4.4em;font-size:clamp(25px,6.6vw,30px);line-height:1.12}
.c{opacity:0}.c.in{opacity:1}
#nx{position:absolute;right:16px;bottom:8px;font:700 18px "Pixelify Sans",monospace;color:var(--w2);opacity:0;animation:bob .8s steps(2) infinite}
#nx.on{opacity:1}
#choices{display:grid;gap:10px;margin-top:8px}
#choices button{min-height:52px;padding:8px 14px;text-align:left;font-size:clamp(24px,6vw,28px);background:var(--p1);border:0;box-shadow:0 0 0 3px var(--w1),0 0 0 6px var(--ink)}
#choices button:hover,#choices button:active{background:#ffe38a;box-shadow:0 0 0 3px #d8492f,0 0 0 6px var(--ink)}

/* dodging "later" button + growing "forgive" button */
#choices{position:relative;--bh:52px;--gs:13px}
#choices button.yes{min-height:calc(var(--bh) + var(--g,0)*var(--gs));font-size:calc(clamp(24px,6vw,28px) + var(--g,0)*2px);text-align:center;transition:min-height .35s steps(5),font-size .35s steps(5)}
#choices button.dodge{justify-self:start;max-width:100%;min-height:calc(var(--bh) - 8px);font-size:clamp(20px,5.2vw,25px);transform-origin:left center;transition:transform .3s steps(5)}
#choices button.dodge.settled{background:#f3e3b8}

/* phones held sideways: keep everything on screen */
@media (orientation:landscape) and (max-height:520px){
 #dlg{bottom:calc(10px + env(safe-area-inset-bottom,0px));padding:10px 12px 12px;max-width:min(640px,calc(100vw - 48px))}
 #tag{top:-36px;font-size:16px}
 #por{width:56px;height:56px}
 #txt{font-size:22px;min-height:0;line-height:1.05}
 #gif{max-height:70px;margin-bottom:6px}
 #choices{--bh:40px;--gs:8px;gap:8px;margin-top:6px}
 #choices button{font-size:22px}
 #meter{top:10%}
 .hud{padding:3px 8px;font-size:12px}.hud b{font-size:14px}
 #hint{bottom:calc(4% + env(safe-area-inset-bottom,0px))}
}

/* heart meter */
#meter{position:fixed;z-index:6;left:50%;top:22%;transform:translate(-50%,-30px);opacity:0;padding:12px 14px 10px;text-align:center;font:700 16px "Pixelify Sans",monospace;transition:opacity .6s,transform .6s;width:min(88vw,420px)}
#meter.on{opacity:1;transform:translate(-50%,0)}
#hearts{display:flex;justify-content:center;gap:3px;margin-top:8px}
#hearts canvas{width:clamp(20px,6.4vw,32px);height:auto;aspect-ratio:9/8;image-rendering:pixelated}
#hearts canvas.pop{animation:pop .4s steps(4)}
@keyframes pop{40%{transform:scale(1.5)}}
@media(prefers-reduced-motion:reduce){#dlg,#toast{transition-duration:.01s}}
</style>
</head>

<div id="toast" class="box"></div>
<div id="meter" class="box"><span id="mname"></span><div id="hearts"></div></div>
<div id="dlg" class="box">
  <div id="tag"></div>
  <img id="gif" alt="">
  <div class="row"><canvas id="por" width="16" height="16"></canvas><div id="txt" aria-live="polite"></div></div>
  <div id="choices"></div><div id="nx">▼</div>
</div>

 blooms.forEach(b=>{if(b.k>.3+bright*.7)return;const sz=b.y>H*.85?2:1,sw=Math.round(Math.sin(t*2+b.x)*.5);P(b.x,b.y,1,2,L([70,130,60],[92,176,70]));P(b.x+sw,b.y-sz,sz,sz,b.c)});
 cow(Math.round(W*.2),Math.round(H*.8));cow(Math.round(W*.72),Math.round(H*.7));
 flies.forEach(f=>{g.globalAlpha=(.5+.5*Math.sin(t*3+f.p))*(1-bright*.85);const x=f.x+Math.sin(t*.6+f.p)*6,y=f.y+Math.cos(t*.5+f.p)*4;P(x-1,y-1,3,3,"rgba(255,240,150,.35)");P(x,y,1,1,"#fff6b0")});g.globalAlpha=1;
 extras();
 if(ambient&&parts.filter(p=>p.a).length<14&&rnd()<.05)parts.push({a:1,x:rnd()*W,y:-3,vx:0,vy:7+rnd()*7,g:0,c:"#ffb0c4",ph:rnd()*6});
 parts=parts.filter(p=>{p.vy+=p.g*dt;p.x+=p.vx*dt+(p.a?Math.sin(t*1.5+p.ph)*6*dt:0);p.y+=p.vy*dt;if(p.h){P(p.x,p.y,1,1,p.c);P(p.x+2,p.y,1,1,p.c);P(p.x,p.y+1,3,1,p.c);P(p.x+1,p.y+2,1,1,p.c)}else P(p.x,p.y,2,2,p.c);return p.y<H+4})}
let ambient=false,last=performance.now();
function loop(n){const dt=Math.min(.05,(n-last)/1e3);last=n;draw(dt);requestAnimationFrame(loop)}
layout();addEventListener("resize",()=>{layout();drawMail(flag)});requestAnimationFrame(loop);

/* ---------- sprites: mailbox, letter, portrait, hearts ---------- */
const mc=$("mc").getContext("2d"),M=rr(mc);let flag=false;
function drawMail(up){mc.clearRect(0,0,24,28);M(10,14,3,14,"#8a5a2b");M(10,14,1,14,"#a8743a");M(3,6,18,9,"#f2c200");M(3,6,18,2,"#ffe066");M(3,13,18,2,"#b58a00");M(3,7,3,7,"#4a1a14");
 if(up){M(20,0,1,7,"#6b4a2b");M(21,0,4,3,"#e0303a");M(21,0,4,1,"#ff7b7b")}else{M(20,7,1,3,"#6b4a2b");M(21,9,3,2,"#e0303a")}
 if(!up){M(0,8,5,4,"#fff8e6");M(0,8,5,1,"#d8c9a0")}}drawMail(false);
(()=>{const c=$("ev").getContext("2d"),e=rr(c);e(0,0,16,11,"#a8874f");e(1,1,14,9,"#f8efd4");for(let i=0;i<7;i++){e(1+i,1+i*.6,1,1,"#c9b27a");e(14-i,1+i*.6,1,1,"#c9b27a")}e(7,5,2,2,"#d8492f");e(7,4,2,1,"#f26b55")})();
const HEART=[".XX...XX.","XXXX.XXXX","XXXXXXXXX","XXXXXXXXX",".XXXXXXX.","..XXXXX..","...XXX...","....X...."];
function heart(cv,fill){const c=cv.getContext("2d"),e=rr(c);c.clearRect(0,0,9,8);HEART.forEach((row,y)=>[...row].forEach((ch,x)=>{if(ch==="X"){[[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy])=>e(x+dx,y+dy,1,1,"#4a1420"))}}));
 HEART.forEach((row,y)=>[...row].forEach((ch,x)=>{if(ch==="X")e(x,y,1,1,fill?(y<2&&x<4?"#ff8f9a":"#e8384f"):"#8a6a4a")}))}
function portrait(m){const c=$("por").getContext("2d"),e=rr(c);e(0,0,16,16,"#f3cf9f");e(2,14,12,2,"#b8453a");e(3,13,10,1,"#b8453a");e(6,12,4,2,"#e0ac82");e(4,4,8,8,"#f2c39b");e(3,3,10,3,"#5a3420");e(3,3,2,7,"#5a3420");e(11,3,2,7,"#5a3420");e(4,2,8,1,"#5a3420");
 e(6,8,1,1,"#2a1a14");e(9,8,1,1,"#2a1a14");
 if(m==="sad"){e(5,7,1,1,"#4a2a18");e(6,6,1,1,"#4a2a18");e(9,6,1,1,"#4a2a18");e(10,7,1,1,"#4a2a18");e(7,11,2,1,"#9a4a3a");e(6,12,1,1,"#9a4a3a");e(9,12,1,1,"#9a4a3a");e(5,10,1,1,"#8ec9ff");e(5,11,1,1,"#8ec9ff")}
 else if(m==="happy"){e(6,11,4,1,"#9a4a3a");e(5,10,1,1,"#9a4a3a");e(10,10,1,1,"#9a4a3a");e(5,9,1,1,"#f29a9a");e(10,9,1,1,"#f29a9a")}
 else{e(5,7,2,1,"#4a2a18");e(9,7,2,1,"#4a2a18");e(7,11,2,1,"#9a4a3a")}}

/* ---------- HUD clock ---------- */
function clock(){const d=new Date();$("hd").textContent=d.toLocaleDateString("en",{weekday:"short"})+". "+d.getDate();let h=d.getHours(),ap=h>=12?"pm":"am";h=h%12||12;$("ht").textContent=h+":"+String(d.getMinutes()).padStart(2,"0")+" "+ap}clock();setInterval(clock,20000);
$("tag").textContent=CONFIG.me;$("mname").textContent=CONFIG.me+"'s heart";

/* ---------- dialogue ---------- */
const pages=CONFIG.paragraphs;let pi=-1,typing=false,tok=0,mode="letter";
async function say(text,mood,gif){const my=++tok;typing=true;$("nx").classList.remove("on");$("choices").innerHTML="";portrait(mood);
 const im=$("gif");if(gif){im.src=gif;im.style.display="block"}else im.style.display="none";
 const box=$("txt");box.innerHTML="";const cs=[...text].map(ch=>{const s=document.createElement("span");s.className="c";s.textContent=ch;box.appendChild(s);return s});
 for(const s of cs){if(my!==tok)return;s.classList.add("in");await sleep(/[.,!?]/.test(s.textContent)?300:s.textContent===" "?28:40)}
 if(my===tok)finish()}
function finish(){tok++;typing=false;document.querySelectorAll(".c").forEach(c=>c.classList.add("in"));
 if(mode==="letter"&&pi===pages.length-1){laterChoices()}else if(mode==="letter"){$("nx").classList.add("on")}}
function laterChoices(){const box=$("choices"),steps=CONFIG.laterSteps;box.innerHTML="";box.style.setProperty("--g",0);
 let n=0,cx=0,stamp=-1e3;
 const yb=document.createElement("button");yb.className="yes";yb.textContent=CONFIG.choiceYes;yb.onclick=e=>{e.stopPropagation();yes()};
 const lb=document.createElement("button");lb.className="dodge";lb.textContent=steps[0];
 const move=()=>{const sc=1-Math.min(n,4)*.05,cw=box.clientWidth,bw=lb.offsetWidth*sc,mx=Math.max(0,cw-bw);let x=mx?Math.random()*mx:0;
  if(mx>40&&Math.abs(x-cx)<mx*.3)x=cx<mx/2?mx*(.6+Math.random()*.4):Math.random()*mx*.4;
  cx=x;lb.style.transform=`translateX(${x}px) scale(${sc})`;lb.style.order=Math.random()<.5?"-1":"0"};
 const act=()=>{n++;box.style.setProperty("--g",Math.min(n,5));lb.textContent=steps[n%steps.length];move()};
 /* pointerdown so it dodges the instant a finger lands (works on touch + mouse) */
 lb.addEventListener("pointerdown",e=>{e.preventDefault();e.stopPropagation();stamp=performance.now();act()});
 lb.addEventListener("click",e=>{e.stopPropagation();if(performance.now()-stamp<700)return;act()});   /* keyboard / fallback */
 box.append(yb,lb)}
async function notifyDiscord(){if(!CONFIG.webhook)return;
 try{await fetch(CONFIG.webhook,{method:"POST",headers:{"Content-Type":"application/json"},keepalive:true,
  body:JSON.stringify({username:"Letter Mailbox",content:"💌 **She just opened your letter!** ("+new Date().toLocaleString("en-PH",{timeZone:"Asia/Manila",dateStyle:"medium",timeStyle:"short"})+")"})})}catch(e){}}
function choices(list){const box=$("choices");box.innerHTML="";box.style.removeProperty("--g");list.forEach(([label,fn])=>{const b=document.createElement("button");b.textContent=label;b.onclick=e=>{e.stopPropagation();fn()};box.appendChild(b)})}
function show(i){pi=i;const mood=i<pages.length*.6?"sad":"soft",gf=CONFIG.gifs.find(x=>x.after===i&&x.src);say(pages[i],mood,gf&&gf.src)}
$("dlg").addEventListener("pointerup",e=>{if(e.target.closest("button")||mode!=="letter")return;if(typing)finish();else if(pi<pages.length-1)show(pi+1)});

/* ---------- endings ---------- */
function burst(){for(let i=0;i<110;i++)parts.push({a:0,h:i%3===0,x:W/2+(rnd()-.5)*10,y:H*.72,vx:(rnd()-.5)*90,vy:-(50+rnd()*90),g:80,c:["#ff8fa8","#fff2f2","#ffd84d","#e8384f","#ffb0c4","#7de3ff","#b28dff","#7dffb0"][i%8]})}
async function yes(){mode="end";$("dim").classList.remove("on");target=1;burst();$("dlg").style.pointerEvents="none";
 const hs=$("hearts");hs.innerHTML="";const cs=Array.from({length:10},()=>{const c=document.createElement("canvas");c.width=9;c.height=8;heart(c,false);hs.appendChild(c);return c});
 $("meter").classList.add("on");say(CONFIG.yes,"happy");await sleep(900);
 for(const c of cs){heart(c,true);c.classList.add("pop");await sleep(320)}await sleep(600);burst()}
function restart(){mode="letter";$("choices").innerHTML="";show(0)}

/* ---------- opening: flag up, letter floats out, toast, dialogue ---------- */
$("mail").onclick=async()=>{$("mail").onclick=null;notifyDiscord();$("hint").style.opacity=0;$("bang").style.display="none";flag=true;drawMail(true);ambient=true;
 const r=$("mail").getBoundingClientRect(),ev=$("ev"),w=16*S;ev.style.cssText=`width:${w}px;left:${r.left+2*S}px;top:${r.top+6*S}px`;
 const dx=innerWidth/2-(r.left+2*S+w/2),dy=innerHeight*.3-(r.top+6*S);await sleep(350);
 ev.animate([{opacity:1,transform:"translate(0,0) scale(1)"},{opacity:1,transform:`translate(${dx*.5}px,${dy*.6}px) scale(1.6)`,offset:.4},{opacity:1,transform:`translate(${dx}px,${dy}px) scale(2.4)`,offset:.75},{opacity:0,transform:`translate(${dx}px,${dy-20}px) scale(3)`}],{duration:2200,easing:"ease-in-out",fill:"forwards"});
 await sleep(800);$("toast").textContent=CONFIG.toast;$("toast").classList.add("on");await sleep(1500);$("toast").classList.remove("on");
 $("dim").classList.add("on");$("dlg").classList.add("on");await sleep(900);show(0)};
</script>
